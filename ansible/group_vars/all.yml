---
ansible_user: vagrant
ansible_ssh_common_args: '-o StrictHostKeyChecking=yes'
# Ubuntu package defaults; verify availability for the actual guest release.
docker_packages:
  - docker.io
  - docker-compose-v2
common_packages:
  - curl
  - wget
  - htop
  - vim
  - git
  - net-tools
  - unzip
app_directories:
  - /opt/apps
  - /opt/logs
  - /opt/config
  - /opt/monitoring
app_user: "{{ ansible_user }}"
app_group: "{{ ansible_user }}"
# Supply grafana_admin_password via an encrypted, untracked vars file.
