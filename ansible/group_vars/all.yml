---
# Global variables for all hosts. Verify host keys before connecting.
ansible_user: vagrant
ansible_ssh_common_args: '-o StrictHostKeyChecking=yes'

# Existing Docker dependencies; Compose v2 migration is still pending.
docker_packages:
  - docker.io
  - docker-compose
  - python3-pip
  - python3-docker

common_packages:
  - curl
  - wget
  - htop
  - vim
  - git
  - net-tools
  - unzip

app_directories:
  - /opt/apps
  - /opt/logs
  - /opt/config
  - /opt/monitoring

app_user: "{{ ansible_user }}"
app_group: "{{ ansible_user }}"
