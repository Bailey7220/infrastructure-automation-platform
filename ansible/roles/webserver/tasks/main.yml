---
- name: Create web content directory
  ansible.builtin.file:
    path: /opt/webapp/html
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: true

- name: Render web application configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  loop:
    - {src: index.html.j2, dest: /opt/webapp/html/index.html}
    - {src: nginx.conf.j2, dest: /opt/webapp/nginx.conf}
    - {src: docker-compose.yml.j2, dest: /opt/webapp/docker-compose.yml}
  become: true

- name: Start web containers with Compose v2
  community.docker.docker_compose_v2:
    project_src: /opt/webapp
    state: present
    build: never
    pull: missing
  become: true
  when: not ansible_check_mode

- name: Verify local web HTTP response
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
  register: web_health
  until: web_health.status | default(0) == 200
  retries: 10
  delay: 5
  when: not ansible_check_mode
