---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install common and Docker packages
  ansible.builtin.apt:
    name: "{{ common_packages + docker_packages }}"
    state: present
  become: true

- name: Configure Docker logging and storage
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart docker
  become: true

- name: Start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Apply pending Docker configuration before starting applications
  ansible.builtin.meta: flush_handlers

- name: Verify Compose v2 CLI is installed
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: compose_version
  changed_when: false
  become: true
  when: not ansible_check_mode

- name: Require Compose 2.18 or newer
  ansible.builtin.assert:
    that:
      - (compose_version.stdout | trim | regex_replace('^v', '')) is version('2.18.0', '>=')
    fail_msg: Install a compatible Docker Compose v2 plugin on this guest.
  when: not ansible_check_mode

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop: "{{ app_directories }}"
  become: true
