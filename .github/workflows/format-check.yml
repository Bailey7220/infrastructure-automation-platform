name: Static Configuration Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.1'
      - run: terraform fmt -check -no-color
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'ansible-core==2.16.14'
      - run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible
      - run: ansible-playbook --syntax-check -i inventory.ini playbook.yml
        working-directory: ansible
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script line endings and syntax without execution
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if (( ${#scripts[@]} == 0 )); then
            printf '%s\n' 'No shell scripts found in scripts/.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            if LC_ALL=C grep -q $'\r' "$script"; then
              printf 'Carriage return found in %s; use LF line endings.\n' "$script" >&2
              exit 1
            fi
            bash -n "$script"
            printf 'Syntax and line-ending checks passed: %s\n' "$script"
          done
