# Static checks only. No provisioning, service-health claims, or destruction.
stages:
  - validate

terraform_validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  script:
    - cd terraform
    - terraform fmt -check -no-color
    - terraform init -backend=false -input=false
    - terraform validate -no-color

ansible_syntax:
  stage: validate
  image: python:3.11-slim
  before_script:
    - pip install 'ansible-core==2.16.14'
  script:
    - cd ansible
    - ansible-playbook --syntax-check -i inventory.ini playbook.yml
